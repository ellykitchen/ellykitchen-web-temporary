# ───────────────────────────────────────────────
# 엘리키친 소개 페이지 설정
# 문구·연락처·사진은 대부분 이 파일에서 바꿀 수 있다.
# ───────────────────────────────────────────────

# 사이트 기본
page_title        : 엘리키친
site_description  : 20년 외식 경력으로 자체 개발한 수제 밀키트 전문점, 엘리키친. 부산 해운대구 좌동.
canonical_url     : https://www.ellykitchen.co.kr
og_image          : https://www.ellykitchen.co.kr/assets/social-media-banner.jpg
app_icon          : assets/app-icon.png

# 브랜드 (문구는 앱 lib/i18n/ko.i18n.json의 홈 A·온보딩 문구와 같게 맞춘다)
brand:
  name            : 엘리키친
  tagline         : 20년 외식 경력으로 만든 수제 밀키트와 반찬
  store_line      : 엘리키친 · 해운대점                # 앱 home.intro.storeLine
  title_lines:                                        # 앱 home.intro.title
    - 20년 외식 경력으로 만든
    - 수제 밀키트와 반찬
  lead            : 건강하고 맛있는 한 끼를 드리고 싶은 엘리가 운영해요.   # 앱 home.intro.description
  hero_image      : assets/menu/hero.jpg
  hero_image_alt  : 고기, 오징어, 떡, 양파를 넣고 참깨를 뿌린 매운 볶음

# 앱 내려받기 (스토어 링크)
app:
  app_store_url   : https://apps.apple.com/kr/app/id6820393074
  play_store_url  : https://play.google.com/store/apps/details?id=kr.co.ellykitchen.mobile

# 메인 섹션 (위에서 아래 순서). id는 주소(/about 등)와 오른쪽 섹션 표시에 쓴다.
# 예전 주소 /about·/food·/location은 각각 story·menu·location 섹션으로 이어진다.
sections:
  - id: home
    label: 앱 다운로드
  - id: story
    label: 엘리키친
  - id: signup
    label: 가입
  - id: ordersheet
    label: 주문서
  - id: howto
    label: 주문 과정
  - id: pickup
    label: 픽업
  - id: menu
    label: 메뉴
  - id: location
    label: 오시는 길

# 엘리키친 (앱 onboarding.header)
story:
  title           : 엘리키친
  heading_lines:
    - 매일 한 끼를
    - 든든하게 채워 드릴게요
  text            : 건강하고 맛있는 음식을 집에서도 간편하게 드실 수 있도록, 엘리가 자체 개발한 레시피로 재료 손질부터 조리까지 매장에서 직접 해요.
  photos:                                             # 원형 사진 (대체 텍스트는 보이는 모습)
    - src         : assets/menu/menu-01.jpg
      alt         : 치즈를 올려 구운 단호박
    - src         : assets/menu/brand-1.jpg
      alt         : 통에 담은 배추김치
    - src         : assets/menu/menu-04.jpg
      alt         : 윤기 나게 조린 연근
    - src         : assets/menu/brand-2.jpg
      alt         : 속을 파내 손질한 단호박
    - src         : assets/menu/menu-06.jpg
      alt         : 무와 고기를 넣은 국
    - src         : assets/menu/brand-3.jpg
      alt         : 보쌈 고기와 두부

# 가입 (앱 onboarding.step.signup, 단계 이름은 home.step)
signup:
  title           : 가입
  thumb           : assets/menu/brand-3.jpg
  heading_lines:
    - 가입하시면 주문하실 수 있게
    - 준비할게요
  text_lines:
    - 매장에서 확인하는 데 시간이 조금 걸려요.
    - 확인이 끝나면 바로 알림을 보내 드릴게요.
  steps:
    - 가입 완료
    - 매장 준비
    - 주문 가능
  current_step    : 2                                 # 매장 준비
  image           : assets/menu/banchan-packed.jpg
  image_alt       : 용기마다 나눠 담아 줄지어 놓은 반찬

# 주문서 (앱 onboarding.step.order)
ordersheet:
  title           : 주문서
  thumb           : assets/menu/fried-rice.jpg
  heading_lines:
    - 주문서에 올라온 메뉴를
    - 주문하실 수 있어요
  text_lines:
    - 주문서가 올라오면 앱 홈에서 바로 보실 수 있어요.
    - 1인 주방이라 수량이 정해져 있어요.
  device          : assets/app/home.webp
  device_alt      : 엘리키친 앱 홈 화면. 주문서 카드에 주문·입금·픽업 날짜와 남은 시간이 보인다.

# 주문 과정 (앱 스토어 스크린샷 문구)
howto:
  title           : 앱에서 이렇게 주문하실 수 있어요
  items:
    - device      : assets/app/menu-detail.webp
      text        : "원하는 옵션과 수량으로\n담으실 수 있어요"
      alt         : 앱 메뉴 상세 화면
    - device      : assets/app/order.webp
      text        : "픽업하실 날과 매장을\n주문 전에 보실 수 있어요"
      alt         : 앱 주문하기 화면
    - device      : assets/app/order-detail.webp
      text        : "주문 진행 상황을\n한눈에 보실 수 있어요"
      alt         : 앱 주문 상세 화면
    - device      : assets/app/favorite.webp
      text        : "찜한 메뉴를\n모아 보실 수 있어요"
      alt         : 앱 찜 화면

# 픽업 (앱 onboarding.step.pickup·home.howToOrder.pickup)
pickup:
  title           : 픽업
  heading_lines:
    - 픽업일에 매장에서
    - 받으실 수 있어요
  text_lines:
    - 메뉴가 준비되면 알림을 보내 드려요.
    - 정성껏 준비해 두고 기다릴게요.
  image           : assets/photos/storefront.jpg
  image_alt       : 엘리키친 해운대점 매장 외관. 아치형 입구 위에 엘리키친 간판이 걸려 있다.

# 메뉴 (앱 home.menuShowcase, 유의사항 common.notice.menuPhoto)
# 메뉴 이름은 매장 확인 뒤 넣는다. 지금 대체 텍스트는 보이는 모습 설명.
menu:
  title           : 이런 메뉴를 만들어요
  subtitle        : 수제 밀키트 · 반찬
  notice          : 메뉴 사진은 연출된 이미지로 실제와 다를 수 있어요.
  items:
    - src         : assets/menu/menu-01.jpg
      alt         : 치즈를 올려 구운 단호박
    - src         : assets/menu/menu-02.jpg
      alt         : 소스를 발라 구운 다진 고기 요리
    - src         : assets/menu/menu-03.jpg
      alt         : 새우와 방울토마토를 넣은 파스타
    - src         : assets/menu/menu-04.jpg
      alt         : 윤기 나게 조린 연근
    - src         : assets/menu/menu-05.jpg
      alt         : 소시지와 계란을 넣고 만 랩
    - src         : assets/menu/menu-06.jpg
      alt         : 무와 고기를 넣은 국
    - src         : assets/menu/menu-07.jpg
      alt         : 양파, 버섯과 함께 볶은 소고기
    - src         : assets/menu/menu-08.jpg
      alt         : 양배추를 넣은 매운 볶음

# 오시는 길
location:
  title           : 오시는 길
  store_name      : 엘리키친 · 해운대점
  road_address    : 부산광역시 해운대구 대천로 110, 1층
  lot_address     : 좌동 1295-2
  phone           : 0507-1370-1273
  hours           :                                   # 예) "매일 10:00 – 20:00 (일요일 휴무)". 비우면 표시하지 않는다.
  parking         : 정문 도로변 주차 또는 후문 주차장 이용 가능 (무료)
  transit         : 부산 2호선 장산역 4번 출구에서 도보 약 11분
  naver_map_url   : https://map.naver.com/p/entry/place/1584111651
  lat             : 35.1748429                        # 매장 좌표 (네이버 지도 기준)
  lng             : 129.1743505
  # 네이버 지도 API 클라이언트 ID (네이버 클라우드 플랫폼 > Maps > Web Dynamic Map 의 Client ID).
  # 비어 있으면 키가 필요 없는 구글 지도 임베드로 대신 표시한다.
  naver_map_key_id:
  image           : assets/photos/storefront-day.jpg
  image_alt       : 낮에 찍은 엘리키친 매장 입구
  image_caption   : 부산 해운대구 좌동

# 회사 정보 (푸터). 비운 항목은 표시하지 않는다.
company:
  name            : 엘리키친
  legal_name      : 엘리키친                          # 상호 (사업자등록증 기준)
  owner           : 진은경                            # 대표자
  business_number : 470-63-00674                      # 사업자등록번호
  mail_order_number: 2024-부산해운대-0001          # 통신판매업 신고번호
  instagram       :                                   # 인스타그램 사용자명 (@ 제외). 현재 페이지에서는 사용하지 않음
  kakao_channel   :                                   # 카카오톡 채널 URL

# 약관·처리방침 페이지 주소 (푸터 링크). 비우면 링크를 표시하지 않는다.
legal:
  terms_url       : /terms
  privacy_url     : /privacy

# 테마 색
# 가게 외관 톤: 크림색 벽, 차콜 간판, 주황 포인트
color:
  accent          : "#ee8a2e"                         # 간판 EK 마크·창틀 주황
  accent_dark     : "#cf6f1c"
  text            : "#3a3633"                         # 간판 차콜
  text_muted      : "#7a726b"
  cream           : "#f6f0e6"                         # 외벽 크림색
  charcoal        : "#4a4744"                         # 간판 바탕
  cream_deep      : "#efe5d4"                         # 구분 섹션 바탕
  surface         : "#fffcf7"                         # 카드·음식 섹션 바탕
  line            : "#e4d8c4"                         # 구분선
  tint            : "#fbe6d0"                         # 아이콘 배지·배지 바탕

####################################################
### Jekyll 설정
####################################################

sass:
  style: :compressed

exclude:
  - LICENSE
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock

markdown: kramdown
